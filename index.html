<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Literata:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:wght@400;600&family=EB+Garamond:wght@400;600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<script>
/* loads each library from a local file first, then falls back to the internet */
function ld(a){return new Promise((ok,no)=>{const n=a.shift();if(!n)return no(new Error('library missing'));const s=document.createElement('script');s.src=n;s.onload=ok;s.onerror=()=>ld(a).then(ok,no);document.head.appendChild(s)})}
var libs=ld(['jszip.min.js','https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js']).then(()=>ld(['epub.min.js','https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js']));
libs.catch(()=>{});
</script>
<style>
:root{--bg:#fbfaf7;--fg:#1b1b1b;--mut:#8a8a8a;--ln:rgba(0,0,0,.14);--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--fg:#f2f2f2;--mut:#8d8d92;--ln:rgba(255,255,255,.16);--card:#1d1d20}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Literata,Georgia,serif;background:var(--bg);color:var(--fg)}
h1,h2,.fr{font-family:Fraunces,Georgia,serif;font-weight:700}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1{font-size:34px;margin-bottom:18px}
.mut{color:var(--mut);font-size:14px}
.tab{position:fixed;inset:0;overflow:auto;display:none;padding:calc(env(safe-area-inset-top,0px) + 64px) 20px calc(env(safe-area-inset-bottom,0px) + 92px)}
.tab.on{display:block}
#home{--wp:linear-gradient(160deg,#27324a,#6b4e71 60%,#c98b6b);background:var(--wp) center/cover;color:#fff}
#home::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.5));z-index:-1}
#gear{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;padding:8px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;border-top:1px solid var(--ln);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;padding:10px 0 8px;opacity:.45;display:grid;justify-items:center;gap:3px;font-style:italic;font-size:12px}
#nav button.on{opacity:1}
body.h #gear,body.h #nav{color:#fff}
body.h #nav{background:transparent;border-color:rgba(255,255,255,.35)}
.cv{aspect-ratio:2/3;background:#444 center/cover;border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font:700 13px Fraunces,serif;color:#fff;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.now{display:flex;gap:16px;align-items:flex-start;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.4);margin-bottom:26px}
.now .cv{width:108px;flex:none}
.inf{flex:1;min-width:0}
.inf b{font:700 19px/1.2 Fraunces,serif;display:block}
.inf small{opacity:.8;display:block;margin:4px 0 14px;font-size:13px}
.pb{height:2px;background:rgba(255,255,255,.35)}.pb i{display:block;height:100%;background:#fff}
.inf p{font-size:13px;margin:8px 0 14px;opacity:.9}
.btn{border:1px solid currentColor;border-radius:99px;padding:7px 18px;font-size:14px}
.hi h2{font-size:clamp(36px,11vw,56px);line-height:1.05}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:20px 16px}
.bk span{display:block;font-size:12.5px;margin-top:8px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}.row .bk{width:112px;flex:none}
#q{width:100%;font:inherit;font-size:16px;padding:12px 16px;border-radius:12px;border:0;background:var(--card);color:var(--fg);margin-bottom:24px;box-shadow:inset 0 0 0 1px var(--ln)}
h3{font:600 12px Literata,serif;color:var(--mut);margin-bottom:12px;letter-spacing:.04em}
#sets{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 40px}
#sets.on{display:block}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar h2{font-size:30px}.bar button{font-size:32px;padding:0 8px}
.it{display:block;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--ln);font:700 19px Fraunces,serif}
#sets label{display:block;padding:16px 0 4px;font:700 19px Fraunces,serif}
#nmi{width:100%;margin-top:8px;font:400 16px Literata,serif;padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--fg)}
.tp p{font-size:12px;color:var(--mut);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--ln);border-radius:99px;padding:6px 12px;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tiles button{border:1px solid var(--ln);border-radius:10px;padding:10px 0;font:600 18px Literata,serif;display:grid;gap:2px}
.tiles small{font:11px sans-serif;opacity:.7}
.sel{border-color:var(--fg)!important;box-shadow:0 0 0 1px var(--fg)}
#rd{position:fixed;inset:0;z-index:20;display:none;overflow:hidden}
#rd.on{display:block}
#view,#view2,#sh{position:absolute;left:18px;right:18px;top:calc(env(safe-area-inset-top,0px) + 48px);bottom:calc(env(safe-area-inset-bottom,0px) + 44px)}
#view2{visibility:hidden;z-index:0}#sh{z-index:1;pointer-events:none;opacity:0;background:linear-gradient(to right,rgba(0,0,0,.45),rgba(0,0,0,0) 65%)}#view{z-index:2}
#view,#view2{backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:left center}
#tap{position:absolute;inset:0;z-index:10;touch-action:none}
.rb{position:absolute;left:0;right:0;z-index:11;display:flex;align-items:center;padding:0 12px;transition:opacity .2s}
#rt{top:env(safe-area-inset-top,0px);height:48px;justify-content:space-between}
#rt button{padding:8px;font:600 18px Literata,serif}
#rt.off{opacity:0;pointer-events:none}
#rbm{bottom:env(safe-area-inset-bottom,0px);height:44px;justify-content:center;font-size:12px;opacity:.65;pointer-events:none}
#bkmark{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:13;width:32px;height:42px;padding:0;opacity:.92;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));}
#bkmark svg{width:30px;height:40px;display:block}
#bkmark path{fill:#1683ff;stroke:#0b64c7;stroke-width:1}
#bkmark.off{display:none}
#bkmark:not(.on) path{opacity:.18}
#bkmark.on path{opacity:1}
#speak{position:relative}
#voicePanel{position:absolute;z-index:14;right:12px;top:calc(env(safe-area-inset-top,0px) + 50px);width:min(92vw,340px);background:var(--card);color:var(--fg);border-radius:14px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.3);display:none}
#voicePanel.on{display:block}
#voicePanel label{display:block;font-size:12px;color:var(--mut);margin:5px 0}
#voiceSelect{width:100%;font:inherit;padding:9px;border:1px solid var(--ln);border-radius:9px;background:var(--card);color:var(--fg)}
#voicePanel .vrow{display:flex;gap:7px;margin-top:9px}
#voicePanel .vrow button{flex:1;border:1px solid var(--ln);border-radius:9px;padding:8px;font-size:13px}
#voicePanel .vrow button.sel{border-color:#1683ff;box-shadow:0 0 0 1px #1683ff}
#curl{position:absolute;inset:0;z-index:8;pointer-events:none;visibility:hidden;overflow:hidden;transform-style:preserve-3d}
#curl .sheet{position:absolute;inset:-3%;background:linear-gradient(135deg,rgba(255,255,255,.98) 0%,rgba(250,249,245,.98) 62%,rgba(218,215,208,.9) 78%,rgba(255,255,255,.98) 86%);box-shadow:-14px -6px 28px rgba(0,0,0,.24),inset 14px 0 22px rgba(0,0,0,.05);transform-origin:100% 100%;clip-path:polygon(100% 100%,100% 0,72% 26%,47% 53%,24% 78%,0 100%);border-radius:2px}
#curl.on{visibility:visible}
#curl.next .sheet{transform:rotate(-10deg) scale(1.02)}
#curl.prev .sheet{transform-origin:0 100%;clip-path:polygon(0 100%,0 0,28% 26%,53% 53%,76% 78%,100% 100%);transform:rotate(10deg) scale(1.02)}

#tpm{position:absolute;z-index:12;right:12px;top:calc(env(safe-area-inset-top,0px) + 50px);width:min(92vw,340px);background:var(--card);color:var(--fg);border-radius:14px;padding:6px 14px 14px;box-shadow:0 8px 30px rgba(0,0,0,.3);display:none}
#tpm.on{display:block}
#ts{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#ts.on{opacity:1}
</style>
</head>
<body class="h">

<main id="home" class="tab on">
  <h1>Reading Now</h1>
  <div id="now" class="now"></div>
  <div class="hi">
    <h2>Welcome Back</h2><h2 id="nm"></h2>
  </div>
</main>

<main id="lib" class="tab">
  <h1>Library</h1>
  <div id="grid" class="grid"></div>
  <p class="mut" style="margin-top:28px">Press and hold a book to remove it.</p>
</main>

<main id="srch" class="tab">
  <input id="q" type="search" placeholder="Search your library">
  <h3>IN YOUR LIBRARY</h3>
  <div id="res" class="row"></div>
</main>

<button id="gear" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>

<nav id="nav">
  <button data-n="home" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Home</button>
  <button data-n="srch"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>Search</button>
  <button data-n="lib"><svg class="i" viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 8l4 11"/></svg>Library</button>
</nav>

<div id="sets">
  <div class="bar"><h2>Settings</h2><button id="sx" aria-label="Close">×</button></div>
  <button class="it" id="swp">Add custom wallpaper</button>
  <button class="it" id="srw">Reset wallpaper</button>
  <button class="it" id="sab">Add books</button>
  <label>Your name<input id="nmi" type="text" maxlength="24"></label>
  <div class="fr" style="margin-top:22px;font-size:19px">Reading style</div>
  <div id="tp1"></div>
</div>

<div id="rd">
  <div id="view2"></div>
  <div id="sh"></div>
  <div id="view"></div>
  <div id="tap"></div>
  <div id="rt" class="rb"><button id="bk" aria-label="Back">←</button><div style="display:flex;gap:2px;align-items:center"><button id="speak" aria-label="Read aloud">🔊</button><button id="aa">Aa</button></div></div>
  <button id="bkmark" aria-label="Bookmark this page" title="Bookmark"><svg viewBox="0 0 32 44" aria-hidden="true"><path d="M4 2h24v39L16 33 4 41z"/></svg></button>
  <div id="voicePanel"><label for="voiceSelect">Read aloud</label><select id="voiceSelect"></select><div class="vrow"><button id="vplay">Play</button><button id="vstop">Stop</button></div></div>
  <div id="curl"><div class="sheet"></div></div>
  <div id="tpm"><div id="tp2"></div></div>
  <div id="rbm" class="rb"><span id="pl"></span></div>
</div>

<input id="fb" type="file" multiple hidden>
<input id="fw" type="file" accept="image/*" hidden>
<div id="ts"></div>

<script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FU='https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:wght@400;600&family=EB+Garamond:wght@400;600&family=Lora:wght@400;600&display=swap';
const F={'Literata':'Literata,Georgia,serif','Source Serif':'"Source Serif 4",Georgia,serif','EB Garamond':'"EB Garamond",Georgia,serif','Lora':'Lora,Georgia,serif'};
const TH={o:{n:'Original',bg:'#ffffff',fg:'#1b1b1b'},p:{n:'Paper',bg:'#e9e6df',fg:'#2b2b2b'},c:{n:'Calm',bg:'#f1e3c8',fg:'#3b2f1f'},q:{n:'Quiet',bg:'#3c3c3e',fg:'#cfcfd3'}};
let S={name:'Reader',font:'Literata',theme:'o',size:100,turn:'3d'};
try{Object.assign(S,JSON.parse(localStorage.getItem('er')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('er',JSON.stringify(S))}catch(e){}};
let books=[],cur,book,rend,rend2,atS=false,atE=false,U={},wpU='',speech=null;

/* storage: b = book info, d = book files, k = wallpaper */
const db=new Promise((r,j)=>{const q=indexedDB.open('er',1);q.onupgradeneeded=()=>{q.result.createObjectStore('b',{keyPath:'id'});q.result.createObjectStore('d');q.result.createObjectStore('k')};q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const tx=async(s,m,f)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction(s,m),o=f(t.objectStore(s));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error)})};
const put=(s,v,k)=>tx(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k)),all=s=>tx(s,'readonly',o=>o.getAll()),get=(s,k)=>tx(s,'readonly',o=>o.get(k)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
const toast=t=>{const e=$('ts');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2600)};

/* tabs */
function showTab(n){['home','lib','srch'].forEach(t=>$(t).classList.toggle('on',t===n));document.body.classList.toggle('h',n==='home');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.n===n))}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.n));

/* covers and lists */
const cov=(b,c='')=>{if(b.cover&&!U[b.id])U[b.id]=URL.createObjectURL(b.cover);const h=[...b.title].reduce((a,x)=>a+x.charCodeAt(0),0)%360;return `<div class="cv ${c}" style="${U[b.id]?`background-image:url(${U[b.id]})`:`background:hsl(${h},35%,32%)`}">${U[b.id]?'':esc(b.title)}</div>`};
const item=b=>`<div class="bk" data-id="${b.id}">${cov(b)}<span>${esc(b.title)}</span></div>`;
function srch(){const q=$('q').value.trim().toLowerCase(),r=books.filter(b=>(b.title+' '+b.author).toLowerCase().includes(q));$('res').innerHTML=r.length?r.map(item).join(''):'<p class="mut">No matching books.</p>'}
async function refresh(){
  books=(await all('b')).sort((a,b)=>b.added-a.added);
  $('grid').innerHTML=books.length?books.map(item).join(''):'<p class="mut">Your library is empty. Open settings to add books.</p>';
  const n=books.filter(b=>b.opened).sort((a,b)=>b.opened-a.opened)[0]||books[0],p=n?Math.round((n.pct||0)*100):0;
  $('now').innerHTML=n?`${cov(n)}<div class="inf"><b>${esc(n.title)}</b><small>${esc(n.author)}</small><div class="pb"><i style="width:${p}%"></i></div><p>${p}%${n.left!=null?` · ${n.left} pages left`:''}</p><button class="btn" data-id="${n.id}">${n.opened?'Continue':'Start reading'}</button></div>`:`<div class="inf"><b>Nothing yet</b><p>Add your first book to start reading.</p><button class="btn" id="ab">Add a book</button></div>`;
  srch();
}
$('q').oninput=srch;

/* adding books */
async function addFiles(files){
  try{await libs}catch(e){toast('Reader engine could not load. Check your internet.');return}
  for(const f of files){
    try{
      const buf=await f.arrayBuffer(),bk=ePub(buf.slice(0));
      await bk.ready;const m=await bk.loaded.metadata;let cover=null;
      try{const u=await bk.coverUrl();if(u)cover=await(await fetch(u)).blob()}catch(e){}
      const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await put('d',buf,id);
      await put('b',{id,title:m.title||f.name.replace(/\.epub$/i,''),author:m.creator||'',cover,pct:0,left:null,cfi:null,added:Date.now()});
      bk.destroy();
    }catch(e){toast(f.name+': '+((e&&e.message)||e))}
  }
  await refresh();
}
$('fb').onchange=async e=>{$('sets').classList.remove('on');await addFiles([...e.target.files]);e.target.value='';showTab('lib')};

/* wallpaper (home only) */
function showWp(bl){if(wpU)URL.revokeObjectURL(wpU);wpU=bl?URL.createObjectURL(bl):'';$('home').style.setProperty('--wp',wpU?`url(${wpU})`:'linear-gradient(160deg,#27324a,#6b4e71 60%,#c98b6b)')}
$('fw').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const bm=await createImageBitmap(f),s=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));await put('k',bl,'wp');showWp(bl);$('sets').classList.remove('on');showTab('home')}catch(x){toast('Could not use that image')}e.target.value=''};
$('swp').onclick=()=>$('fw').click();
$('srw').onclick=async()=>{await del('k','wp');showWp()};
$('sab').onclick=()=>$('fb').click();

/* settings */
const greet=()=>$('nm').textContent=S.name+' :)';
$('gear').onclick=()=>{$('nmi').value=S.name;$('sets').classList.add('on')};
$('sx').onclick=()=>$('sets').classList.remove('on');
$('nmi').oninput=e=>{S.name=e.target.value.trim()||'Reader';save();greet()};
const typeHTML=()=>`<div class="tp"><p>Font</p><div class="chips">${Object.keys(F).map(k=>`<button data-f="${k}" style="font-family:${F[k]}">${k}</button>`).join('')}</div><p>Page color</p><div class="tiles">${Object.keys(TH).map(k=>`<button data-t="${k}" style="background:${TH[k].bg};color:${TH[k].fg}">Aa<small>${TH[k].n}</small></button>`).join('')}</div><p>Text size</p><div class="chips"><button data-s="-10">A−</button><button data-s="10">A+</button></div><p>Page turn</p><div class="chips"><button data-a="3d">3D page</button><button data-a="flip">Simple</button><button data-a="none">None</button></div></div>`;
$('tp1').innerHTML=$('tp2').innerHTML=typeHTML();
function mark(){document.querySelectorAll('[data-a]').forEach(b=>b.classList.toggle('sel',b.dataset.a===S.turn));document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('sel',b.dataset.f===S.font));document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('sel',b.dataset.t===S.theme))}
function applyType(){
  const t=TH[S.theme];$('rd').style.background=t.bg;$('rd').style.color=t.fg;$('view').style.background=t.bg;$('view2').style.background=t.bg;
  [rend,rend2].forEach(r=>{if(!r)return;
    r.themes.override('color',t.fg,true);r.themes.override('background',t.bg);
    r.themes.override('line-height','1.55');r.themes.font(F[S.font]);r.themes.fontSize(S.size+'%');
  });
}

/* accessibility + bookmark */
const bookmarkOn=()=>!!(cur&&cur.bookmarkCfi&&cur.bookmarkCfi===cur.cfi);
function markBookmark(){const b=$('bkmark');b.classList.toggle('on',bookmarkOn());b.classList.toggle('off',!cur)}
async function toggleBookmark(){if(!cur)return;cur.bookmarkCfi=bookmarkOn()?null:cur.cfi;await put('b',cur);markBookmark();toast(cur.bookmarkCfi?'Bookmark saved':'Bookmark removed')}
function voices(){const list=speechSynthesis.getVoices(),sel=$('voiceSelect');if(!sel)return;const old=sel.value;sel.innerHTML='';const preferred=list.filter(v=>/female|woman|samantha|zira|victoria|karen|moira|ava|susan|hazel|google uk english female|microsoft.*female/i.test(v.name+' '+v.voiceURI));const ordered=[...preferred,...list.filter(v=>!preferred.includes(v))];ordered.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+(v.lang?' · '+v.lang:'');sel.appendChild(o)});if(old&&ordered.some(v=>v.voiceURI===old))sel.value=old;else if(ordered[0])sel.value=ordered[0].voiceURI}
function currentText(){try{const c=rend&&rend.getContents&&rend.getContents()[0];return c&&c.document&&c.document.body?c.document.body.innerText.replace(/\s+/g,' ').trim():''}catch(e){return ''}}
function stopSpeech(){if('speechSynthesis' in window)speechSynthesis.cancel();speech=null;$('vplay').textContent='Play'}
function speakCurrent(){if(!('speechSynthesis' in window)){toast('Text-to-speech is not supported on this device');return}const text=currentText();if(!text){toast('No readable text on this page');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=speechSynthesis.getVoices().find(x=>x.voiceURI===$('voiceSelect').value)||speechSynthesis.getVoices()[0];if(v)u.voice=v;u.rate=.92;u.pitch=1.03;u.volume=1;u.onend=()=>{speech=null;$('vplay').textContent='Play'};speech=u;speechSynthesis.speak(u);$('vplay').textContent='Pause'}
function toggleSpeech(){if(!('speechSynthesis' in window))return;if(speechSynthesis.speaking&&!speechSynthesis.paused){speechSynthesis.pause();$('vplay').textContent='Resume';return}if(speechSynthesis.paused){speechSynthesis.resume();$('vplay').textContent='Pause';return}speakCurrent()}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=voices;setTimeout(voices,150)}

/* reading */
const upd=()=>{if(!cur||!book)return;try{if(book.locations.length())cur.pct=book.locations.percentageFromCfi(cur.cfi)}catch(e){}$('pl').textContent=(cur.left!=null?`${cur.left} pages left in chapter`:'')+(cur.pct?` · ${Math.round(cur.pct*100)}%`:'');put('b',cur)};
async function openBook(id){
  try{await libs}catch(e){toast('Reader engine could not load. Check your internet.');return}
  cur=books.find(b=>b.id===id);if(!cur)return;
  const buf=await get('d',id);if(!buf){toast('Book file missing');return}
  cur.opened=Date.now();$('rd').classList.add('on');$('rt').classList.remove('off');$('tpm').classList.remove('on');$('pl').textContent='';markBookmark();
  book=ePub(buf);rend=book.renderTo('view',{width:'100%',height:'100%',flow:'paginated',spread:'none'});
  rend.hooks.content.register(c=>c.addStylesheet(FU));
  rend.on('relocated',l=>{if(!cur)return;atS=!!l.atStart;atE=!!l.atEnd;clearTimeout(pt);pt=setTimeout(()=>{if(!busy&&S.turn==='3d'&&rend2)doPrep()},300);cur.cfi=l.start.cfi;const d=l.start.displayed;cur.left=d?d.total-d.page:null;upd();markBookmark();});
  applyType();
  try{await rend.display(cur.cfi||undefined)}catch(e){toast('This book could not be opened');closeBook();return}
  ensureB();
  book.ready.then(()=>book.locations.generate(1500)).then(upd).catch(()=>{});
}
async function closeBook(){
  stopSpeech();$('voicePanel').classList.remove('on');$('bkmark').classList.add('off');
  $('rd').classList.remove('on');
  try{rend&&rend.destroy()}catch(e){}
  try{rend2&&rend2.destroy()}catch(e){}
  try{book&&book.destroy()}catch(e){}
  rend=rend2=book=cur=null;prepCfi=null;wipe();await refresh();
}
$('bk').onclick=closeBook;
$('aa').onclick=()=>$('tpm').classList.toggle('on');
/* page turn. 3D page: a second hidden copy of the book sits one page ahead (or behind); the current page swings on its spine to reveal it. */
let busy=false,prepP=Promise.resolve(),prepCfi=null,pt;
const RM=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const wipe=()=>{['view','view2'].forEach(i=>{const e=$(i);e.getAnimations().forEach(a=>a.cancel());e.style.transform='';e.style.filter='';e.style.opacity='';e.style.zIndex=''});$('view2').style.visibility='hidden'};
const doPrep=()=>{const c=cur&&cur.cfi;if(!rend2||!c)return prepP;prepP=prepP.then(async()=>{try{await rend2.display(c);await rend2.next();prepCfi=c}catch(e){prepCfi=null}});return prepP};
function ensureB(){if(!book||rend2||S.turn!=='3d')return;rend2=book.renderTo('view2',{width:'100%',height:'100%',flow:'paginated',spread:'none'});rend2.hooks.content.register(c=>c.addStylesheet(FU));applyType();doPrep()}
async function turn(d){
  if(!rend||busy)return;
  const go=()=>d>0?rend.next():rend.prev();
  if(S.turn==='none'||RM()||(d>0&&atE)||(d<0&&atS)){go();return}
  busy=true;let moved=false;const go2=()=>{moved=true;return go()};
  try{await(S.turn==='3d'&&rend2?flip3d(d,go2):simple(d,go2))}
  catch(e){wipe();if(!moved)go()}
  busy=false;
  if(S.turn==='3d')setTimeout(doPrep,150);
}
async function flip3d(d,go){
  await prepP;const v=$('view'),w=$('view2'),sh=$('sh'),curl=$('curl'),sheet=curl.querySelector('.sheet');
  if(d>0){if(prepCfi!==cur.cfi)await doPrep()}else{prepCfi=null;await rend2.display(cur.cfi);await rend2.prev()}
  const dur=720;curl.className='on '+(d>0?'next':'prev');v.style.transformOrigin=d>0?'100% 100%':'0 100%';v.style.zIndex=3;w.style.zIndex=1;w.style.visibility='visible';sh.style.opacity='.25';
  const endX=d>0?'rotateY(-58deg) rotateX(3deg) scale(.98)':'rotateY(58deg) rotateX(3deg) scale(.98)';
  const a=v.animate([{transform:'rotateY(0deg) rotateX(0deg) scale(1)',filter:'brightness(1)'},{transform:endX,filter:'brightness(.72)'}],{duration:dur,easing:'cubic-bezier(.32,.08,.18,1)',fill:'forwards'});
  const frames=d>0?[{transform:'translate(0,0) rotate(0deg) scale(1)',opacity:.05},{transform:'translate(-5%,4%) rotate(-7deg) scale(1.03)',opacity:.75,offset:.38},{transform:'translate(-16%,10%) rotate(-14deg) scale(1.08)',opacity:.98},{transform:'translate(-28%,17%) rotate(-20deg) scale(1.12)',opacity:0}]:[{transform:'translate(0,0) rotate(0deg) scale(1)',opacity:.05},{transform:'translate(5%,4%) rotate(7deg) scale(1.03)',opacity:.75,offset:.38},{transform:'translate(16%,10%) rotate(14deg) scale(1.08)',opacity:.98},{transform:'translate(28%,17%) rotate(20deg) scale(1.12)',opacity:0}];
  const b=sheet.animate(frames,{duration:dur,easing:'cubic-bezier(.32,.08,.18,1)',fill:'forwards'});sh.animate([{opacity:0},{opacity:.5,offset:.42},{opacity:.08}],{duration:dur,easing:'ease-out'});
  await a.finished;await go();await new Promise(r=>setTimeout(r,50));b.cancel();a.cancel();curl.className='';sh.style.opacity='0';w.style.visibility='hidden';v.style.transform='';v.style.filter='';v.style.zIndex='';w.style.zIndex='';
}

async function simple(d,go){
  const v=$('view'),P='perspective(1400px) rotateY(',T='transform .24s ease-in, opacity .24s ease-in, filter .24s';
  v.style.transformOrigin=d>0?'left center':'right center';
  v.style.transition=T;v.style.transform=P+(d>0?-75:75)+'deg)';v.style.opacity='.15';v.style.filter='brightness(.8)';
  await new Promise(r=>setTimeout(r,240));
  try{await go()}catch(e){}
  v.style.transition='none';v.style.transformOrigin=d>0?'right center':'left center';
  v.style.transform=P+(d>0?75:-75)+'deg)';
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  v.style.transition=T.replace(/ease-in/g,'ease-out');
  v.style.transform='none';v.style.opacity='1';v.style.filter='none';
  await new Promise(r=>setTimeout(r,250));
  v.style.transition='';v.style.transformOrigin='';v.style.transform='';
}
let sx=0;
$('tap').onpointerdown=e=>sx=e.clientX;
$('tap').onpointerup=e=>{
  if(!rend)return;const dx=e.clientX-sx;
  if(dx>50)turn(-1);else if(dx<-50)turn(1);
  else{$('tpm').classList.remove('on');const f=e.clientX/innerWidth;f<.3?turn(-1):f>.7?turn(1):$('rt').classList.toggle('off')}
};

$('bkmark').onclick=toggleBookmark;
$('speak').onclick=()=>{$('voicePanel').classList.toggle('on');voices()};
$('vplay').onclick=toggleSpeech;
$('vstop').onclick=stopSpeech;
$('voiceSelect').onchange=()=>{if(speechSynthesis.speaking){stopSpeech();speakCurrent()}};

/* clicks */
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-id]');if(o){openBook(o.dataset.id);return}
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='ab'){$('fb').click();return}
  const d=b.dataset;
  if(d.f)S.font=d.f;else if(d.t)S.theme=d.t;else if(d.s)S.size=Math.min(200,Math.max(70,S.size+ +d.s));else if(d.a)S.turn=d.a;else return;
  save();applyType();mark();
  if(d.a==='3d')ensureB();
  if(book&&rend2&&S.turn==='3d')setTimeout(doPrep,400);
});
document.addEventListener('contextmenu',async e=>{
  const k=e.target.closest('.bk');if(!k)return;e.preventDefault();
  const b=books.find(x=>x.id===k.dataset.id);
  if(b&&confirm(`Remove "${b.title}" from your library?`)){await del('b',b.id);await del('d',b.id);await refresh()}
});

(async()=>{greet();mark();applyType();await refresh();try{showWp(await get('k','wp'))}catch(e){}})();
</script>
</body>
