<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reader</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Literata:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:wght@400;600&family=EB+Garamond:wght@400;600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js"></script>
<style>
:root{--bg:#fbfaf7;--fg:#1b1b1b;--mut:#8a8a8a;--ln:rgba(0,0,0,.14);--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--fg:#f2f2f2;--mut:#8d8d92;--ln:rgba(255,255,255,.16);--card:#1d1d20}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Literata,Georgia,serif;background:var(--bg);color:var(--fg)}
h1,h2,.fr{font-family:Fraunces,Georgia,serif;font-weight:700}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1{font-size:34px;margin-bottom:18px}
.mut{color:var(--mut);font-size:14px}
.tab{position:fixed;inset:0;overflow:auto;display:none;padding:calc(env(safe-area-inset-top,0px) + 64px) 20px calc(env(safe-area-inset-bottom,0px) + 92px)}
.tab.on{display:block}
#home{--wp:linear-gradient(160deg,#27324a,#6b4e71 60%,#c98b6b);background:var(--wp) center/cover;color:#fff}
#home::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.5));z-index:-1}
#gear{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;padding:8px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;border-top:1px solid var(--ln);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;padding:10px 0 8px;opacity:.45;display:grid;justify-items:center;gap:3px;font-style:italic;font-size:12px}
#nav button.on{opacity:1}
body.h #gear,body.h #nav{color:#fff}
body.h #nav{background:transparent;border-color:rgba(255,255,255,.35)}
.cv{aspect-ratio:2/3;background:#444 center/cover;border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font:700 13px Fraunces,serif;color:#fff;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.now{display:flex;gap:16px;align-items:flex-start;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.4);margin-bottom:26px}
.now .cv{width:108px;flex:none}
.inf{flex:1;min-width:0}
.inf b{font:700 19px/1.2 Fraunces,serif;display:block}
.inf small{opacity:.8;display:block;margin:4px 0 14px;font-size:13px}
.pb{height:2px;background:rgba(255,255,255,.35)}.pb i{display:block;height:100%;background:#fff}
.inf p{font-size:13px;margin:8px 0 14px;opacity:.9}
.btn{border:1px solid currentColor;border-radius:99px;padding:7px 18px;font-size:14px}
.hi h2{font-size:clamp(36px,11vw,56px);line-height:1.05}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:20px 16px}
.bk span{display:block;font-size:12.5px;margin-top:8px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}.row .bk{width:112px;flex:none}
#q{width:100%;font:inherit;font-size:16px;padding:12px 16px;border-radius:12px;border:0;background:var(--card);color:var(--fg);margin-bottom:24px;box-shadow:inset 0 0 0 1px var(--ln)}
h3{font:600 12px Literata,serif;color:var(--mut);margin-bottom:12px;letter-spacing:.04em}
#sets{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 40px}
#sets.on{display:block}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar h2{font-size:30px}.bar button{font-size:32px;padding:0 8px}
.it{display:block;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--ln);font:700 19px Fraunces,serif}
#sets label{display:block;padding:16px 0 4px;font:700 19px Fraunces,serif}
#nmi{width:100%;margin-top:8px;font:400 16px Literata,serif;padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--fg)}
.tp p{font-size:12px;color:var(--mut);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--ln);border-radius:99px;padding:6px 12px;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tiles button{border:1px solid var(--ln);border-radius:10px;padding:10px 0;font:600 18px Literata,serif;display:grid;gap:2px}
.tiles small{font:11px sans-serif;opacity:.7}
.sel{border-color:var(--fg)!important;box-shadow:0 0 0 1px var(--fg)}
#rd{position:fixed;inset:0;z-index:20;display:none}
#rd.on{display:block}
#view{position:absolute;left:18px;right:18px;top:calc(env(safe-area-inset-top,0px) + 48px);bottom:calc(env(safe-area-inset-bottom,0px) + 44px)}
#tap{position:absolute;inset:0;z-index:2;touch-action:none}
.rb{position:absolute;left:0;right:0;z-index:3;display:flex;align-items:center;padding:0 12px;transition:opacity .2s}
#rt{top:env(safe-area-inset-top,0px);height:48px;justify-content:space-between}
#rt button{padding:8px;font:600 18px Literata,serif}
#rt.off{opacity:0;pointer-events:none}
#rbm{bottom:env(safe-area-inset-bottom,0px);height:44px;justify-content:center;font-size:12px;opacity:.65;pointer-events:none}
#tpm{position:absolute;z-index:4;right:12px;top:calc(env(safe-area-inset-top,0px) + 50px);width:min(92vw,340px);background:var(--card);color:var(--fg);border-radius:14px;padding:6px 14px 14px;box-shadow:0 8px 30px rgba(0,0,0,.3);display:none}
#tpm.on{display:block}
#ts{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#ts.on{opacity:1}
</style>
</head>
<body class="h">

<main id="home" class="tab on">
  <h1>Reading Now</h1>
  <div id="now" class="now"></div>
  <div class="hi">
    <h2>Welcome Back</h2><h2 id="nm"></h2>
  </div>
</main>

<main id="lib" class="tab">
  <h1>Library</h1>
  <div id="grid" class="grid"></div>
  <p class="mut" style="margin-top:28px">Press and hold a book to remove it.</p>
</main>

<main id="srch" class="tab">
  <input id="q" type="search" placeholder="Search your library">
  <h3>IN YOUR LIBRARY</h3>
  <div id="res" class="row"></div>
</main>

<button id="gear" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>

<nav id="nav">
  <button data-n="home" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Home</button>
  <button data-n="srch"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>Search</button>
  <button data-n="lib"><svg class="i" viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 8l4 11"/></svg>Library</button>
</nav>

<div id="sets">
  <div class="bar"><h2>Settings</h2><button id="sx" aria-label="Close">×</button></div>
  <button class="it" id="swp">Add custom wallpaper</button>
  <button class="it" id="srw">Reset wallpaper</button>
  <button class="it" id="sab">Add books</button>
  <label>Your name<input id="nmi" type="text" maxlength="24"></label>
  <div class="fr" style="margin-top:22px;font-size:19px">Reading style</div>
  <div id="tp1"></div>
</div>

<div id="rd">
  <div id="view"></div>
  <div id="tap"></div>
  <div id="rt" class="rb"><button id="bk" aria-label="Back">←</button><button id="aa">Aa</button></div>
  <div id="tpm"><div id="tp2"></div></div>
  <div id="rbm" class="rb"><span id="pl"></span></div>
</div>

<input id="fb" type="file" accept="application/epub+zip,.epub" multiple hidden>
<input id="fw" type="file" accept="image/*" hidden>
<div id="ts"></div>

<script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FU='https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:wght@400;600&family=EB+Garamond:wght@400;600&family=Lora:wght@400;600&display=swap';
const F={'Literata':'Literata,Georgia,serif','Source Serif':'"Source Serif 4",Georgia,serif','EB Garamond':'"EB Garamond",Georgia,serif','Lora':'Lora,Georgia,serif'};
const TH={o:{n:'Original',bg:'#ffffff',fg:'#1b1b1b'},p:{n:'Paper',bg:'#e9e6df',fg:'#2b2b2b'},c:{n:'Calm',bg:'#f1e3c8',fg:'#3b2f1f'},q:{n:'Quiet',bg:'#3c3c3e',fg:'#cfcfd3'}};
let S={name:'Reader',font:'Literata',theme:'o',size:100};
try{Object.assign(S,JSON.parse(localStorage.getItem('er')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('er',JSON.stringify(S))}catch(e){}};
let books=[],cur,book,rend,U={},wpU='';

/* storage: b = book info, d = book files, k = wallpaper */
const db=new Promise((r,j)=>{const q=indexedDB.open('er',1);q.onupgradeneeded=()=>{q.result.createObjectStore('b',{keyPath:'id'});q.result.createObjectStore('d');q.result.createObjectStore('k')};q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const tx=async(s,m,f)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction(s,m),o=f(t.objectStore(s));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error)})};
const put=(s,v,k)=>tx(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k)),all=s=>tx(s,'readonly',o=>o.getAll()),get=(s,k)=>tx(s,'readonly',o=>o.get(k)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
const toast=t=>{const e=$('ts');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2600)};

/* tabs */
function showTab(n){['home','lib','srch'].forEach(t=>$(t).classList.toggle('on',t===n));document.body.classList.toggle('h',n==='home');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.n===n))}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.n));

/* covers and lists */
const cov=(b,c='')=>{if(b.cover&&!U[b.id])U[b.id]=URL.createObjectURL(b.cover);const h=[...b.title].reduce((a,x)=>a+x.charCodeAt(0),0)%360;return `<div class="cv ${c}" style="${U[b.id]?`background-image:url(${U[b.id]})`:`background:hsl(${h},35%,32%)`}">${U[b.id]?'':esc(b.title)}</div>`};
const item=b=>`<div class="bk" data-id="${b.id}">${cov(b)}<span>${esc(b.title)}</span></div>`;
function srch(){const q=$('q').value.trim().toLowerCase(),r=books.filter(b=>(b.title+' '+b.author).toLowerCase().includes(q));$('res').innerHTML=r.length?r.map(item).join(''):'<p class="mut">No matching books.</p>'}
async function refresh(){
  books=(await all('b')).sort((a,b)=>b.added-a.added);
  $('grid').innerHTML=books.length?books.map(item).join(''):'<p class="mut">Your library is empty. Open settings to add books.</p>';
  const n=books.filter(b=>b.opened).sort((a,b)=>b.opened-a.opened)[0]||books[0],p=n?Math.round((n.pct||0)*100):0;
  $('now').innerHTML=n?`${cov(n)}<div class="inf"><b>${esc(n.title)}</b><small>${esc(n.author)}</small><div class="pb"><i style="width:${p}%"></i></div><p>${p}%${n.left!=null?` · ${n.left} pages left`:''}</p><button class="btn" data-id="${n.id}">${n.opened?'Continue':'Start reading'}</button></div>`:`<div class="inf"><b>Nothing yet</b><p>Add your first book to start reading.</p><button class="btn" id="ab">Add a book</button></div>`;
  srch();
}
$('q').oninput=srch;

/* adding books */
async function addFiles(files){
  for(const f of files){
    try{
      const buf=await f.arrayBuffer(),bk=ePub(buf.slice(0));
      await bk.ready;const m=await bk.loaded.metadata;let cover=null;
      try{const u=await bk.coverUrl();if(u)cover=await(await fetch(u)).blob()}catch(e){}
      const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await put('d',buf,id);
      await put('b',{id,title:m.title||f.name.replace(/\.epub$/i,''),author:m.creator||'',cover,pct:0,left:null,cfi:null,added:Date.now()});
      bk.destroy();
    }catch(e){toast('Could not read '+f.name)}
  }
  await refresh();
}
$('fb').onchange=async e=>{$('sets').classList.remove('on');await addFiles([...e.target.files]);e.target.value='';showTab('lib')};

/* wallpaper (home only) */
function showWp(bl){if(wpU)URL.revokeObjectURL(wpU);wpU=bl?URL.createObjectURL(bl):'';$('home').style.setProperty('--wp',wpU?`url(${wpU})`:'linear-gradient(160deg,#27324a,#6b4e71 60%,#c98b6b)')}
$('fw').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const bm=await createImageBitmap(f),s=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));await put('k',bl,'wp');showWp(bl);$('sets').classList.remove('on');showTab('home')}catch(x){toast('Could not use that image')}e.target.value=''};$('swp').onclick=()=>$('fw').click();$('srw').onclick=async()=>{await del('k','wp');showWp()};
$('sab').onclick=()=>$('fb').click();

/* settings */
const greet=()=>$('nm').textContent=S.name+' :)';
$('gear').onclick=()=>{$('nmi').value=S.name;$('sets').classList.add('on')};$('sx').onclick=()=>$('sets').classList.remove('on');$('nmi').oninput=e=>{S.name=e.target.value.trim()||'Reader';save();greet()};
const typeHTML=()=>`<div class="tp"><p>Font</p><div class="chips">${Object.keys(F).map(k=>`<button data-f="${k}" style="font-family:${F[k]}">${k}</button>`).join('')}</div><p>Page color</p><div class="tiles">${Object.keys(TH).map(k=>`<button data-t="${k}" style="background:${TH[k].bg};color:${TH[k].fg}">Aa<small>${TH[k].n}</small></button>`).join('')}</div><p>Text size</p><div class="chips"><button data-s="-10">A−</button><button data-s="10">A+</button></div></div>`;
$('tp1').innerHTML=$('tp2').innerHTML=typeHTML();
function mark(){document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('sel',b.dataset.f===S.font));document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('sel',b.dataset.t===S.theme))}
function applyType(){
  const t=TH[S.theme];$('rd').style.background=t.bg;$('rd').style.color=t.fg;
  if(!rend)return;
  rend.themes.override('color',t.fg,true);rend.themes.override('background',t.bg);
  rend.themes.override('line-height','1.55');rend.themes.font(F[S.font]);rend.themes.fontSize(S.size+'%');
}

/* reading */
const upd=()=>{if(!cur||!book)return;try{if(book.locations.length())cur.pct=book.locations.percentageFromCfi(cur.cfi)}catch(e){}$('pl').textContent=(cur.left!=null?`${cur.left} pages left in chapter`:'')+(cur.pct?` · ${Math.round(cur.pct*100)}%`:'');put('b',cur)};
async function openBook(id){
  cur=books.find(b=>b.id===id);if(!cur)return;
  const buf=await get('d',id);if(!buf){toast('Book file missing');return}
  cur.opened=Date.now();$('rd').classList.add('on');$('rt').classList.remove('off');$('tpm').classList.remove('on');$('pl').textContent='';
  book=ePub(buf);rend=book.renderTo('view',{width:'100%',height:'100%',flow:'paginated',spread:'none'});
  rend.hooks.content.register(c=>c.addStylesheet(FU));
  rend.on('relocated',l=>{if(!cur)return;cur.cfi=l.start.cfi;const d=l.start.displayed;cur.left=d?d.total-d.page:null;upd()});
  applyType();
  try{await rend.display(cur.cfi||undefined)}catch(e){toast('This book could not be opened');closeBook();return}
  book.ready.then(()=>book.locations.generate(1500)).then(upd).catch(()=>{});
}
async function closeBook(){
  $('rd').classList.remove('on');
  try{rend&&rend.destroy();book&&book.destroy()}catch(e){}
  rend=book=cur=null;await refresh();
}
$('bk').onclick=closeBook;
$('aa').onclick=()=>$('tpm').classList.toggle('on');
let sx=0;
$('tap').onpointerdown=e=>sx=e.clientX;
$('tap').onpointerup=e=>{
  if(!rend)return;const dx=e.clientX-sx;
  if(dx>50)rend.prev();else if(dx<-50)rend.next();
  else{$('tpm').classList.remove('on');const f=e.clientX/innerWidth;f<.3?rend.prev():f>.7?rend.next():$('rt').classList.toggle('off')}
};

/* clicks */
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-id]');if(o){openBook(o.dataset.id);return}
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='ab'){$('fb').click();return}
  const d=b.dataset;
  if(d.f)S.font=d.f;else if(d.t)S.theme=d.t;else if(d.s)S.size=Math.min(200,Math.max(70,S.size+ +d.s));else return;
  save();applyType();mark();
});
document.addEventListener('contextmenu',async e=>{
  const k=e.target.closest('.bk');if(!k)return;e.preventDefault();
  const b=books.find(x=>x.id===k.dataset.id);
  if(b&&confirm(`Remove "${b.title}" from your library?`)){await del('b',b.id);await del('d',b.id);await refresh()}
});

(async()=>{greet();mark();applyType();await refresh();try{showWp(await get('k','wp'))}catch(e){}})();
</script>
</body>
</html>
